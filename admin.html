<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#050505"
>

<title>SoundMe — Admin</title>

<link
  rel="stylesheet"
  href="style.css"
>

<style>

body{
  min-height:100vh;
  background:#050505;
  color:#fff;
}

/* ADMIN */

.admin-page{
  width:min(1000px,92vw);
  margin:0 auto;
  padding:120px 0 100px;
}

.admin-top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:50px;
}

.admin-label{
  color:#666;
  font-size:10px;
  letter-spacing:4px;
  margin-bottom:15px;
}

.admin-title{
  font-size:clamp(45px,8vw,85px);
  line-height:.9;
  letter-spacing:-5px;
}

.admin-user{
  color:#777;
  font-size:11px;
}

.admin-user strong{
  color:#ddd;
}

/* CARDS */

.admin-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.admin-card{
  padding:28px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:18px;
  background:rgba(255,255,255,.025);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.admin-card h2{
  font-size:16px;
  margin-bottom:8px;
}

.admin-card p{
  color:#666;
  font-size:11px;
  line-height:1.7;
}

/* UPLOAD */

.upload-zone{
  margin-top:25px;
  min-height:220px;
  border:1px dashed rgba(255,255,255,.15);
  border-radius:15px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  transition:.2s ease;
}

.upload-zone:hover{
  border-color:rgba(255,255,255,.35);
  background:rgba(255,255,255,.035);
}

.upload-icon{
  width:55px;
  height:55px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  color:#aaa;
  margin-bottom:18px;
}

.upload-zone strong{
  font-size:12px;
  letter-spacing:1px;
}

.upload-zone span{
  color:#555;
  font-size:9px;
  margin-top:8px;
}

#musicInput{
  display:none;
}

/* SELECTED FILES */

.selected-files{
  margin-top:20px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.selected-file{
  min-height:55px;
  padding:10px 13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  background:rgba(255,255,255,.025);
}

.file-info{
  min-width:0;
}

.file-name{
  font-size:11px;
  color:#ddd;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.file-size{
  color:#555;
  font-size:9px;
  margin-top:5px;
}

.remove-file{
  width:30px;
  height:30px;
  flex-shrink:0;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50%;
  background:transparent;
  color:#777;
  cursor:pointer;
}

.remove-file:hover{
  color:#f66;
  border-color:rgba(255,80,80,.25);
}

/* BUTTON */

.admin-button{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#eee;
  color:#050505;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1.5px;
  cursor:pointer;
}

.admin-button:hover{
  background:#fff;
}

.admin-button:disabled{
  opacity:.3;
  cursor:not-allowed;
}

/* TRACKS */

.admin-tracks{
  margin-top:15px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.admin-track{
  padding:13px;
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  background:rgba(255,255,255,.02);
}

.admin-track-cover{
  width:42px;
  height:42px;
  border-radius:8px;
  background:
    linear-gradient(
      135deg,
      #1b1b1b,
      #080808
    );
  display:flex;
  align-items:center;
  justify-content:center;
  color:#555;
  flex-shrink:0;
}

.admin-track-info{
  min-width:0;
  flex:1;
}

.admin-track-name{
  color:#ccc;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.admin-track-meta{
  color:#555;
  font-size:8px;
  margin-top:5px;
}

.admin-delete{
  width:32px;
  height:32px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:50%;
  background:transparent;
  color:#633;
  cursor:pointer;
}

.admin-delete:hover{
  color:#f66;
}

/* STATUS */

.status{
  min-height:18px;
  margin-top:15px;
  color:#666;
  font-size:10px;
  text-align:center;
}

.status.success{
  color:#8a8;
}

.status.error{
  color:#a66;
}

/* LOGOUT */

.admin-footer{
  margin-top:40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.back-button,
.logout-button{
  padding:11px 16px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:9px;
  background:rgba(255,255,255,.025);
  color:#777;
  font-size:9px;
  letter-spacing:1px;
  text-decoration:none;
  cursor:pointer;
}

.logout-button:hover{
  color:#f66;
}

/* MOBILE */

@media(max-width:700px){

  .admin-page{
    padding-top:100px;
  }

  .admin-top{
    display:block;
  }

  .admin-user{
    margin-top:15px;
  }

  .admin-grid{
    grid-template-columns:1fr;
  }

  .admin-title{
    font-size:52px;
  }

}

</style>

</head>


<body>


<main class="admin-page">


  <!-- HEADER -->

  <div class="admin-top">

    <div>

      <div class="admin-label">
        SOUNDME / CONTROL
      </div>

      <h1 class="admin-title">
        ADMIN.
      </h1>

    </div>


    <div class="admin-user">

      Logged in as

      <strong
        id="adminUsername"
      >
        Admin
      </strong>

    </div>

  </div>


  <!-- CONTENT -->

  <div class="admin-grid">


    <!-- UPLOAD -->

    <section class="admin-card">

      <h2>
        Upload Music
      </h2>

      <p>
        Add music to your SoundMe library.
        Select one or multiple audio files.
      </p>


      <div
        class="upload-zone"
        id="uploadZone"
      >

        <div class="upload-icon">
          +
        </div>

        <strong>
          SELECT AUDIO FILES
        </strong>

        <span>
          MP3 · WAV · M4A · AAC · OGG
        </span>

      </div>


      <input
        id="musicInput"
        type="file"
        multiple
        accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.webm"
      >


      <div
        class="selected-files"
        id="selectedFiles"
      ></div>


      <button
        class="admin-button"
        id="uploadButton"
        disabled
      >
        ADD TO LIBRARY
      </button>


      <div
        class="status"
        id="uploadStatus"
      ></div>

    </section>


    <!-- LIBRARY -->

    <section class="admin-card">

      <h2>
        Music Library
      </h2>

      <p>
        Music currently stored in this browser.
      </p>


      <div
        class="admin-tracks"
        id="adminTracks"
      >

        <div
          class="status"
          id="libraryStatus"
        >
          Loading library...
        </div>

      </div>

    </section>


  </div>


  <!-- FOOTER -->

  <div class="admin-footer">

    <a
      href="index.html"
      class="back-button"
    >
      ← BACK TO SOUNDME
    </a>


    <button
      class="logout-button"
      id="logoutButton"
    >
      LOG OUT
    </button>

  </div>


</main>


<script src="auth.js"></script>


<script>

/* =========================================================
   ADMIN ACCESS
========================================================= */

const ADMIN_EMAIL =
  "admin@soundme.local";


const currentUser =
  window.SoundMeAuth?.getUser();


if(!currentUser){

  window.location.href =
    "login.html";

}


/* =========================================================
   USER
========================================================= */

const adminUsername =
  document.getElementById(
    "adminUsername"
  );


if(currentUser){

  adminUsername.textContent =
    currentUser.username;

}


/* =========================================================
   ELEMENTS
========================================================= */

const uploadZone =
  document.getElementById(
    "uploadZone"
  );

const musicInput =
  document.getElementById(
    "musicInput"
  );

const selectedFiles =
  document.getElementById(
    "selectedFiles"
  );

const uploadButton =
  document.getElementById(
    "uploadButton"
  );

const uploadStatus =
  document.getElementById(
    "uploadStatus"
  );

const adminTracks =
  document.getElementById(
    "adminTracks"
  );


let filesToUpload = [];


/* =========================================================
   OPEN FILE PICKER
========================================================= */

uploadZone.addEventListener(
  "click",
  () => {

    musicInput.click();

  }
);


/* =========================================================
   FILE SELECTION
========================================================= */

musicInput.addEventListener(
  "change",
  () => {

    filesToUpload =
      Array.from(
        musicInput.files || []
      );

    renderSelectedFiles();

  }
);


/* =========================================================
   RENDER SELECTED
========================================================= */

function renderSelectedFiles(){

  selectedFiles.innerHTML =
    "";


  if(!filesToUpload.length){

    uploadButton.disabled =
      true;

    return;

  }


  filesToUpload.forEach(
    (file,index) => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "selected-file";


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "file-info";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "file-name";

      name.textContent =
        file.name;


      const size =
        document.createElement(
          "div"
        );

      size.className =
        "file-size";

      size.textContent =
        formatFileSize(
          file.size
        );


      info.appendChild(
        name
      );

      info.appendChild(
        size
      );


      const remove =
        document.createElement(
          "button"
        );

      remove.className =
        "remove-file";

      remove.textContent =
        "×";


      remove.addEventListener(
        "click",
        () => {

          filesToUpload.splice(
            index,
            1
          );

          renderSelectedFiles();

        }
      );


      item.appendChild(
        info
      );

      item.appendChild(
        remove
      );


      selectedFiles.appendChild(
        item
      );

    }
  );


  uploadButton.disabled =
    false;

}


/* =========================================================
   FILE SIZE
========================================================= */

function formatFileSize(bytes){

  if(bytes < 1024){

    return bytes + " B";

  }

  if(bytes < 1024 * 1024){

    return (
      (bytes / 1024)
        .toFixed(1) +
      " KB"
    );

  }

  return (
    (bytes / 1024 / 1024)
      .toFixed(1) +
    " MB"
  );

}


/* =========================================================
   LOCAL ADMIN LIBRARY
========================================================= */

const ADMIN_LIBRARY_KEY =
  "soundme_admin_music";


function getAdminLibrary(){

  try{

    return JSON.parse(
      localStorage.getItem(
        ADMIN_LIBRARY_KEY
      )
    ) || [];

  }catch(error){

    return [];

  }

}


function saveAdminLibrary(
  library
){

  localStorage.setItem(
    ADMIN_LIBRARY_KEY,
    JSON.stringify(
      library
    )
  );

}


/* =========================================================
   ADD MUSIC
========================================================= */

uploadButton.addEventListener(
  "click",
  async () => {

    if(!filesToUpload.length){

      return;

    }


    uploadButton.disabled =
      true;


    uploadStatus.className =
      "status";

    uploadStatus.textContent =
      "Adding music...";


    const library =
      getAdminLibrary();


    for(
      const file of filesToUpload
    ){

      const id =
        "track_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2);


      /*
       * This stage only registers
       * the file information.
       *
       * Real server upload will
       * be connected later.
       */

      library.push({

        id,

        name:
          file.name
            .replace(
              /\.[^/.]+$/,
              ""
            ),

        filename:
          file.name,

        type:
          file.type,

        size:
          file.size,

        createdAt:
          Date.now()

      });

    }


    saveAdminLibrary(
      library
    );


    filesToUpload =
      [];

    musicInput.value =
      "";

    renderSelectedFiles();

    renderAdminLibrary();


    uploadStatus.className =
      "status success";

    uploadStatus.textContent =
      "Music added successfully.";

  }
);


/* =========================================================
   RENDER LIBRARY
========================================================= */

function renderAdminLibrary(){

  const library =
    getAdminLibrary();


  adminTracks.innerHTML =
    "";


  if(!library.length){

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "status";

    empty.textContent =
      "No music uploaded yet.";

    adminTracks.appendChild(
      empty
    );

    return;

  }


  library
    .slice()
    .reverse()
    .forEach(
      track => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "admin-track";


        const cover =
          document.createElement(
            "div"
          );

        cover.className =
          "admin-track-cover";

        cover.textContent =
          "♪";


        const info =
          document.createElement(
            "div"
          );

        info.className =
          "admin-track-info";


        const name =
          document.createElement(
            "div"
          );

        name.className =
          "admin-track-name";

        name.textContent =
          track.name;


        const meta =
          document.createElement(
            "div"
          );

        meta.className =
          "admin-track-meta";

        meta.textContent =
          formatFileSize(
            track.size
          );


        info.appendChild(
          name
        );

        info.appendChild(
          meta
        );


        const deleteButton =
          document.createElement(
            "button"
          );

        deleteButton.className =
          "admin-delete";

        deleteButton.textContent =
          "×";


        deleteButton.addEventListener(
          "click",
          () => {

            deleteAdminTrack(
              track.id
            );

          }
        );


        item.appendChild(
          cover
        );

        item.appendChild(
          info
        );

        item.appendChild(
          deleteButton
        );


        adminTracks.appendChild(
          item
        );

      }
    );

}


/* =========================================================
   DELETE TRACK
========================================================= */

function deleteAdminTrack(
  id
){

  const library =
    getAdminLibrary()
      .filter(
        track =>
          track.id !== id
      );


  saveAdminLibrary(
    library
  );


  renderAdminLibrary();

}


/* =========================================================
   LOGOUT
========================================================= */

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    () => {

      if(
        window.SoundMeAuth
      ){

        window.SoundMeAuth.logout();

      }else{

        window.location.href =
          "login.html";

      }

    }
  );


/* =========================================================
   INITIALIZE
========================================================= */

renderAdminLibrary();

</script>


</body>
</html>
