<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>SoundMe</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background: #0b0b0b;
    color: #ffffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    padding-top:
        env(safe-area-inset-top);

    padding-bottom:
        calc(
            92px +
            env(safe-area-inset-bottom)
        );
}

button,
input {
    font: inherit;
}

button {
    border: 0;
    background: none;
    color: inherit;
}

.app {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
}


/* =========================================
   HEADER
========================================= */

.header {
    padding: 22px 18px 14px;
}

.brand {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -0.8px;
}

.user {
    margin-top: 5px;
    color: #8b8b8b;
    font-size: 13px;
}


/* =========================================
   SEARCH
========================================= */

.search-wrap {
    padding: 4px 18px 18px;
}

.search {
    width: 100%;
    height: 44px;

    border-radius: 12px;
    border: 1px solid #242424;

    background: #151515;
    color: white;

    outline: none;

    padding: 0 14px;

    font-size: 15px;
}

.search::placeholder {
    color: #777;
}

.search:focus {
    border-color: #444;
}


/* =========================================
   SECTIONS
========================================= */

.section {
    padding: 0 18px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin: 4px 0 12px;
}

.section-title h2 {
    margin: 0;

    font-size: 17px;
    font-weight: 650;
}

.count {
    color: #777;
    font-size: 12px;
}


/* =========================================
   SONG LIST
========================================= */

.song-list {
    width: 100%;
}

.song {
    width: 100%;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 11px 0;

    cursor: pointer;
}

.song:active {
    opacity: 0.6;
}

.cover {
    width: 48px;
    height: 48px;

    flex: 0 0 48px;

    border-radius: 8px;

    background: #202020;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #777;

    font-size: 17px;
}

.song-info {
    min-width: 0;
    flex: 1;
}

.song-title {
    font-size: 15px;
    font-weight: 500;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.song-artist {
    margin-top: 4px;

    color: #777;

    font-size: 12px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.song-duration {
    color: #666;
    font-size: 12px;
}


/* =========================================
   EMPTY
========================================= */

.empty {
    text-align: center;

    padding: 55px 20px;

    color: #666;

    display: none;
}

.empty-title {
    color: #aaa;

    font-size: 15px;

    margin-bottom: 6px;
}

.empty-text {
    font-size: 12px;
}


/* =========================================
   LOADING
========================================= */

.loading {
    text-align: center;

    padding: 55px 20px;

    color: #666;

    font-size: 13px;
}


/* =========================================
   PLAYER
========================================= */

.player {
    position: fixed;

    z-index: 20;

    left: 0;
    right: 0;
    bottom: 0;

    background:
        rgba(14,14,14,0.96);

    border-top:
        1px solid #242424;

    padding:
        10px
        16px
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);
}

.player-inner {
    width: 100%;
    max-width: 700px;

    margin: 0 auto;
}

.player-info {
    display: flex;
    align-items: center;

    gap: 10px;
}

.player-cover {
    width: 42px;
    height: 42px;

    border-radius: 7px;

    background: #202020;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #777;

    flex: 0 0 42px;
}

.player-text {
    flex: 1;
    min-width: 0;
}

.player-title {
    font-size: 14px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-artist {
    color: #777;

    font-size: 11px;

    margin-top: 3px;
}

.play-button {
    width: 42px;
    height: 42px;

    border-radius: 50%;

    background: #ffffff;
    color: #000000;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 17px;

    cursor: pointer;
}

.progress-area {
    margin-top: 9px;
}

.progress {
    width: 100%;
    height: 3px;

    appearance: none;
    -webkit-appearance: none;

    background: #333;

    border-radius: 10px;

    outline: none;
}

.progress::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #fff;
}

.progress::-moz-range-thumb {
    width: 10px;
    height: 10px;

    border: 0;

    border-radius: 50%;

    background: #fff;
}

.time {
    display: flex;
    justify-content: space-between;

    color: #666;

    font-size: 9px;

    margin-top: 4px;
}


/* =========================================
   RESPONSIVE
========================================= */

@media (min-width: 700px) {

    .player {
        border-radius:
            16px 16px 0 0;
    }

}

</style>

</head>


<body>

<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div class="brand">
            SoundMe
        </div>

        <div
            class="user"
            id="userName"
        >
            Music Library
        </div>

    </header>


    <!-- SEARCH -->

    <div class="search-wrap">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search songs..."
            autocomplete="off"
        >

    </div>


    <!-- LIBRARY -->

    <main class="section">

        <div class="section-title">

            <h2>
                All Songs
            </h2>

            <span
                class="count"
                id="songCount"
            >
                0 songs
            </span>

        </div>


        <div
            id="loading"
            class="loading"
        >
            Loading library...
        </div>


        <div
            id="songList"
            class="song-list"
        ></div>


        <div
            id="empty"
            class="empty"
        >

            <div class="empty-title">
                No songs
            </div>

            <div class="empty-text">
                Forward music to @SoundM3Bot
                to add it to your library.
            </div>

        </div>

    </main>

</div>


<!-- PLAYER -->

<div class="player">

    <div class="player-inner">

        <div class="player-info">


            <div
                class="player-cover"
                id="playerCover"
            >
                ♪
            </div>


            <div class="player-text">

                <div
                    class="player-title"
                    id="playerTitle"
                >
                    Nothing playing
                </div>

                <div
                    class="player-artist"
                    id="playerArtist"
                >
                    Select a song
                </div>

            </div>


            <button
                id="playButton"
                class="play-button"
                aria-label="Play"
            >
                ▶
            </button>


        </div>


        <div class="progress-area">

            <input
                id="progress"
                class="progress"
                type="range"
                min="0"
                max="100"
                value="0"
            >

            <div class="time">

                <span id="currentTime">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>

    </div>

</div>


<audio
    id="audio"
    preload="metadata"
></audio>


<script>

/* =========================================
   CONFIG
========================================= */

const API =
    "https://soundme-api.mahantem2.workers.dev";


/* =========================================
   TELEGRAM
========================================= */

const tg =
    window.Telegram?.WebApp;


let telegramUser = null;


if (tg) {

    tg.ready();

    tg.expand();

    try {

        tg.setHeaderColor(
            "#0b0b0b"
        );

        tg.setBackgroundColor(
            "#0b0b0b"
        );

    } catch (error) {

        console.log(error);

    }


    telegramUser =
        tg.initDataUnsafe?.user ||
        null;


    if (telegramUser) {

        const firstName =
            telegramUser.first_name || "";

        const lastName =
            telegramUser.last_name || "";

        const fullName =
            `${firstName} ${lastName}`.trim();


        if (fullName) {

            document.getElementById(
                "userName"
            ).textContent =
                `Hi, ${fullName}`;

        }

    }

}


/* =========================================
   ELEMENTS
========================================= */

const songList =
    document.getElementById(
        "songList"
    );

const songCount =
    document.getElementById(
        "songCount"
    );

const empty =
    document.getElementById(
        "empty"
    );

const loading =
    document.getElementById(
        "loading"
    );

const search =
    document.getElementById(
        "search"
    );

const audio =
    document.getElementById(
        "audio"
    );

const playerTitle =
    document.getElementById(
        "playerTitle"
    );

const playerArtist =
    document.getElementById(
        "playerArtist"
    );

const playButton =
    document.getElementById(
        "playButton"
    );

const progress =
    document.getElementById(
        "progress"
    );

const currentTime =
    document.getElementById(
        "currentTime"
    );

const duration =
    document.getElementById(
        "duration"
    );


/* =========================================
   STATE
========================================= */

let songs = [];

let currentSong = null;


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(seconds) {

    if (
        !Number.isFinite(
            Number(seconds)
        )
    ) {
        return "0:00";
    }


    const total =
        Math.floor(
            Number(seconds)
        );


    const minutes =
        Math.floor(
            total / 60
        );


    const secs =
        String(
            total % 60
        ).padStart(
            2,
            "0"
        );


    return `${minutes}:${secs}`;

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================
   RENDER
========================================= */

function renderSongs(list) {

    songList.innerHTML = "";


    songCount.textContent =
        `${list.length} ${
            list.length === 1
                ? "song"
                : "songs"
        }`;


    if (!list.length) {

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    list.forEach(song => {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "song";


        item.innerHTML = `

            <div class="cover">
                ♪
            </div>

            <div class="song-info">

                <div class="song-title">
                    ${escapeHTML(song.title)}
                </div>

                <div class="song-artist">
                    ${escapeHTML(song.artist)}
                </div>

            </div>

            <div class="song-duration">
                ${
                    formatTime(
                        song.duration
                    )
                }
            </div>

        `;


        item.addEventListener(
            "click",
            () => {

                playSong(song);

            }
        );


        songList.appendChild(
            item
        );

    });

}


/* =========================================
   LOAD LIBRARY
========================================= */

async function loadSongs() {

    loading.style.display =
        "block";

    empty.style.display =
        "none";


    /*
        Telegram Mini App
        باید User ID داشته باشد.
    */

    if (!telegramUser?.id) {

        loading.textContent =
            "Open SoundMe from Telegram.";

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/songs?user_id=${encodeURIComponent(
                    telegramUser.id
                )}`
            );


        if (!response.ok) {

            throw new Error(
                "API request failed"
            );

        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Unable to load songs"
            );

        }


        songs =
            Array.isArray(
                data.songs
            )
                ? data.songs
                : [];


        loading.style.display =
            "none";


        renderSongs(
            songs
        );


    } catch (error) {

        console.error(
            "Library error:",
            error
        );


        loading.textContent =
            "Couldn't load your library.";

    }

}


/* =========================================
   PLAY SONG
========================================= */

function playSong(song) {

    if (!telegramUser?.id) {
        return;
    }


    currentSong =
        song;


    playerTitle.textContent =
        song.title ||
        "Unknown Song";


    playerArtist.textContent =
        song.artist ||
        "Unknown Artist";


    const streamUrl =
        `${API}/audio?user_id=${encodeURIComponent(
            telegramUser.id
        )}&file_id=${encodeURIComponent(
            song.file_id
        )}`;


    /*
        If clicking the same song,
        don't reload it unnecessarily.
    */

    if (
        audio.dataset.fileId ===
        song.file_id
    ) {

        if (audio.paused) {

            audio.play();

        } else {

            audio.pause();

        }

        return;

    }


    audio.dataset.fileId =
        song.file_id;


    audio.src =
        streamUrl;


    audio.play()
        .catch(error => {

            console.error(
                "Playback error:",
                error
            );

        });


    if (tg) {

        try {

            tg.HapticFeedback
                .impactOccurred(
                    "light"
                );

        } catch (error) {}

    }

}


/* =========================================
   PLAY / PAUSE
========================================= */

playButton.addEventListener(
    "click",
    () => {

        if (!currentSong) {
            return;
        }


        if (!audio.src) {
            return;
        }


        if (audio.paused) {

            audio.play();

        } else {

            audio.pause();

        }

    }
);


/* =========================================
   AUDIO PLAY
========================================= */

audio.addEventListener(
    "play",
    () => {

        playButton.textContent =
            "❚❚";

    }
);


/* =========================================
   AUDIO PAUSE
========================================= */

audio.addEventListener(
    "pause",
    () => {

        playButton.textContent =
            "▶";

    }
);


/* =========================================
   METADATA
========================================= */

audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =========================================
   TIME UPDATE
========================================= */

audio.addEventListener(
    "timeupdate",
    () => {

        if (!audio.duration) {
            return;
        }


        progress.value =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =========================================
   ENDED
========================================= */

audio.addEventListener(
    "ended",
    () => {

        playButton.textContent =
            "▶";


        progress.value =
            0;


        currentTime.textContent =
            "0:00";

    }
);


/* =========================================
   PROGRESS
========================================= */

progress.addEventListener(
    "input",
    () => {

        if (!audio.duration) {
            return;
        }


        audio.currentTime =
            (
                Number(
                    progress.value
                ) / 100
            ) *
            audio.duration;

    }
);


/* =========================================
   SEARCH
========================================= */

search.addEventListener(
    "input",
    () => {

        const query =
            search.value
                .trim()
                .toLowerCase();


        const filtered =
            songs.filter(
                song => {

                    const title =
                        String(
                            song.title || ""
                        ).toLowerCase();


                    const artist =
                        String(
                            song.artist || ""
                        ).toLowerCase();


                    return (
                        title.includes(
                            query
                        ) ||
                        artist.includes(
                            query
                        )
                    );

                }
            );


        renderSongs(
            filtered
        );

    }
);


/* =========================================
   START
========================================= */

loadSongs();

</script>

</body>
</html>
