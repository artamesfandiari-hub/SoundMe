<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>SoundMe</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  min-height:100%;
  background:#090909;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:110px;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  background:none;
  color:inherit;
}

button,
.song{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:720px;
  margin:auto;
}

/* ================================
   HEADER
================================ */

.header{
  padding:24px 18px 16px;
}

.brand{
  font-size:27px;
  font-weight:750;
  letter-spacing:-1px;
}

.user{
  margin-top:5px;
  color:#777;
  font-size:13px;
}

/* ================================
   SEARCH
================================ */

.search-wrap{
  padding:0 18px 22px;
}

.search{
  width:100%;
  height:45px;
  padding:0 15px;
  border:1px solid #242424;
  border-radius:12px;
  outline:none;
  background:#141414;
  color:#fff;
}

.search:focus{
  border-color:#3a3a3a;
}

.search::placeholder{
  color:#666;
}

/* ================================
   LIBRARY
================================ */

.section{
  padding:0 18px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.section-title h2{
  margin:0;
  font-size:17px;
}

.count{
  color:#666;
  font-size:12px;
}

.song{
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px 0;
}

.song:active{
  opacity:.55;
}

.cover{
  width:50px;
  height:50px;
  flex:0 0 50px;
  border-radius:9px;

  background:
    linear-gradient(
      145deg,
      #292929,
      #151515
    );

  display:flex;
  align-items:center;
  justify-content:center;

  color:#888;
}

.song-info{
  flex:1;
  min-width:0;
}

.song-title{
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-artist{
  margin-top:4px;
  color:#6d6d6d;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-duration{
  color:#666;
  font-size:11px;
}

/* ================================
   MINI PLAYER
================================ */

.mini{
  position:fixed;
  z-index:50;

  left:10px;
  right:10px;

  bottom:
    calc(8px + env(safe-area-inset-bottom));

  max-width:700px;
  margin:auto;

  padding:9px;

  border:1px solid #292929;
  border-radius:15px;

  background:rgba(20,20,20,.96);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  box-shadow:
    0 12px 40px rgba(0,0,0,.5);
}

.mini-main{
  display:flex;
  align-items:center;
  gap:10px;
}

.mini-cover{
  width:43px;
  height:43px;
  flex:0 0 43px;

  border-radius:8px;
  background:#222;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#888;
}

.mini-info{
  flex:1;
  min-width:0;
}

.mini-title{
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.mini-artist{
  margin-top:3px;
  color:#707070;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.icon-button{
  width:39px;
  height:39px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;
}

.mini-play{
  background:#fff;
  color:#000;
}

.icon-button svg{
  width:19px;
  height:19px;
}

.mini-progress{
  width:100%;
  height:2px;

  margin-top:7px;

  appearance:none;
  -webkit-appearance:none;

  background:#333;
}

.mini-progress::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:7px;
  height:7px;

  border-radius:50%;
  background:#fff;
}

/* ================================
   FULL PLAYER
================================ */

.full{
  position:fixed;
  inset:0;
  z-index:100;

  display:flex;
  flex-direction:column;

  padding:
    calc(12px + env(safe-area-inset-top))
    18px
    calc(18px + env(safe-area-inset-bottom));

  background:#090909;

  transform:translateY(100%);

  transition:
    transform .35s cubic-bezier(.2,.8,.2,1);
}

.full.open{
  transform:translateY(0);
}

.full-header{
  height:45px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.full-header button{
  width:40px;
  height:40px;

  border-radius:50%;
  background:#151515;

  display:flex;
  align-items:center;
  justify-content:center;
}

.full-header svg{
  width:19px;
  height:19px;
}

.now-playing{
  color:#666;
  font-size:10px;
  letter-spacing:1.5px;
}

/* ================================
   VISUALIZER
================================ */

.visualizer{
  flex:1;
  min-height:260px;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;
}

#visualizerCanvas{
  width:100%;
  height:100%;
}

.visualizer-center{
  position:absolute;

  width:115px;
  height:115px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #292929,
      #111 70%
    );

  box-shadow:
    0 0 60px rgba(255,255,255,.06);

  display:flex;
  align-items:center;
  justify-content:center;

  color:#888;
  font-size:28px;

  pointer-events:none;
}

/* ================================
   INFO
================================ */

.full-info{
  margin-top:5px;
}

.full-title{
  font-size:25px;
  font-weight:700;
  letter-spacing:-.7px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.full-artist{
  margin-top:5px;
  color:#777;
  font-size:14px;
}

/* ================================
   SEEK
================================ */

.seek-area{
  margin-top:24px;
}

.seek{
  width:100%;
  height:4px;

  appearance:none;
  -webkit-appearance:none;

  background:#333;
  border-radius:10px;
}

.seek::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:12px;
  height:12px;

  border-radius:50%;
  background:#fff;
}

.times{
  display:flex;
  justify-content:space-between;

  margin-top:7px;

  color:#666;
  font-size:10px;
}

/* ================================
   CONTROLS
================================ */

.controls{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:24px;
  margin-top:24px;
}

.control{
  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#aaa;
}

.control svg{
  width:20px;
  height:20px;
}

.control.active{
  color:#fff;
}

.play{
  width:64px;
  height:64px;

  border-radius:50%;

  background:#fff;
  color:#000;

  display:flex;
  align-items:center;
  justify-content:center;
}

.play svg{
  width:25px;
  height:25px;
}

/* ================================
   BOTTOM
================================ */

.bottom-controls{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-top:18px;
}

.bottom-controls button{
  width:40px;
  height:40px;
  color:#666;
}

.bottom-controls svg{
  width:19px;
  height:19px;
}

/* ================================
   QUEUE
================================ */

.queue{
  position:fixed;

  z-index:150;

  left:0;
  right:0;
  bottom:0;

  max-height:65vh;

  padding:
    12px 18px
    calc(18px + env(safe-area-inset-bottom));

  border-radius:20px 20px 0 0;

  background:#161616;
  border-top:1px solid #292929;

  transform:translateY(100%);

  transition:
    transform .3s ease;
}

.queue.open{
  transform:translateY(0);
}

.handle{
  width:38px;
  height:4px;

  margin:0 auto 16px;

  border-radius:10px;
  background:#444;
}

.queue-title{
  font-size:17px;
  font-weight:650;
}

.queue-list{
  margin-top:10px;

  max-height:48vh;
  overflow:auto;
}

.queue-item{
  display:flex;
  align-items:center;

  gap:10px;
  padding:9px 0;
}

.queue-item-info{
  min-width:0;
  flex:1;
}

.queue-item-title{
  font-size:13px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.queue-item-artist{
  margin-top:3px;
  color:#666;
  font-size:11px;
}

/* ================================
   EMPTY / LOADING
================================ */

.empty,
.loading{
  text-align:center;
  padding:60px 20px;
  color:#666;
  font-size:13px;
}

.empty{
  display:none;
}

/* ================================
   RESPONSIVE
================================ */

@media(max-height:650px){

  .visualizer{
    min-height:190px;
  }

  .visualizer-center{
    width:90px;
    height:90px;
  }

  .full-title{
    font-size:21px;
  }

  .controls{
    margin-top:16px;
  }

  .bottom-controls{
    margin-top:8px;
  }

}

</style>
</head>

<script>

/* ================================
   CONFIG
================================ */

const API =
  "https://soundme-api.mahantem2.workers.dev";


/* ================================
   TELEGRAM
================================ */

const tg =
  window.Telegram?.WebApp || null;

if(tg){

  tg.ready();
  tg.expand();

  try{
    tg.setHeaderColor("#090909");
    tg.setBackgroundColor("#090909");
  }catch(e){}

}


/* ================================
   ELEMENTS
================================ */

const userName =
  document.getElementById("userName");

const songList =
  document.getElementById("songList");

const songCount =
  document.getElementById("songCount");

const loading =
  document.getElementById("loading");

const empty =
  document.getElementById("empty");

const search =
  document.getElementById("search");

const audio =
  document.getElementById("audio");

const mini =
  document.getElementById("mini");

const miniPlay =
  document.getElementById("miniPlay");

const miniPlayIcon =
  document.getElementById("miniPlayIcon");

const miniTitle =
  document.getElementById("miniTitle");

const miniArtist =
  document.getElementById("miniArtist");

const miniProgress =
  document.getElementById("miniProgress");

const full =
  document.getElementById("full");

const closeFull =
  document.getElementById("closeFull");

const fullTitle =
  document.getElementById("fullTitle");

const fullArtist =
  document.getElementById("fullArtist");

const mainPlay =
  document.getElementById("mainPlay");

const mainPlayIcon =
  document.getElementById("mainPlayIcon");

const previous =
  document.getElementById("previous");

const next =
  document.getElementById("next");

const shuffle =
  document.getElementById("shuffle");

const repeat =
  document.getElementById("repeat");

const seek =
  document.getElementById("seek");

const currentTime =
  document.getElementById("currentTime");

const duration =
  document.getElementById("duration");

const mute =
  document.getElementById("mute");

const muteIcon =
  document.getElementById("muteIcon");

const openQueueButton =
  document.getElementById(
    "openQueueButton"
  );

const queue2 =
  document.getElementById("queue2");

const queue =
  document.getElementById("queue");

const queueList =
  document.getElementById("queueList");

const canvas =
  document.getElementById(
    "visualizerCanvas"
  );


/* ================================
   USER
================================ */

const telegramUser =
  tg?.initDataUnsafe?.user ||
  null;

if(telegramUser){

  const name =
    `${telegramUser.first_name || ""} ${
      telegramUser.last_name || ""
    }`.trim();

  if(name){

    userName.textContent =
      `Hi, ${name}`;

  }

}


/* ================================
   STATE
================================ */

let songs = [];

let currentIndex = -1;

let shuffleMode = false;

let repeatMode = false;

let isMuted = false;

let audioContext = null;

let analyser = null;

let sourceNode = null;

let visualizerRunning = false;


/* ================================
   HELPERS
================================ */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatTime(value){

  if(!Number.isFinite(Number(value))){
    return "0:00";
  }

  const total =
    Math.floor(Number(value));

  const minutes =
    Math.floor(total / 60);

  const seconds =
    String(total % 60)
      .padStart(2,"0");

  return `${minutes}:${seconds}`;

}


/* ================================
   LOAD SONGS
================================ */

async function loadSongs(){

  if(!telegramUser?.id){

    loading.textContent =
      "Open SoundMe from Telegram.";

    return;

  }

  try{

    const response =
      await fetch(
        `${API}/songs?user_id=${
          encodeURIComponent(
            telegramUser.id
          )
        }`
      );

    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }

    const data =
      await response.json();

    if(!data.success){

      throw new Error(
        data.error ||
        "Failed to load songs"
      );

    }

    songs =
      Array.isArray(data.songs)
        ? data.songs
        : [];

    loading.style.display =
      "none";

    renderSongs(songs);
    renderQueue();

  }catch(error){

    console.error(
      "Library error:",
      error
    );

    loading.textContent =
      "Couldn't load your library.";

  }

}


/* ================================
   RENDER SONGS
================================ */

function renderSongs(list){

  songList.innerHTML = "";

  songCount.textContent =
    `${list.length} ${
      list.length === 1
        ? "song"
        : "songs"
    }`;

  if(!list.length){

    empty.style.display =
      "block";

    return;

  }

  empty.style.display =
    "none";

  list.forEach(song=>{

    const item =
      document.createElement("div");

    item.className =
      "song";

    item.innerHTML = `

      <div class="cover">

        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        >

          <path
            d="M9 18V5l10-2v13"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <circle
            cx="6"
            cy="18"
            r="3"
          />

          <circle
            cx="16"
            cy="16"
            r="3"
          />

        </svg>

      </div>

      <div class="song-info">

        <div class="song-title">
          ${escapeHTML(song.title)}
        </div>

        <div class="song-artist">
          ${escapeHTML(song.artist)}
        </div>

      </div>

      <div class="song-duration">
        ${formatTime(song.duration)}
      </div>

    `;

    item.addEventListener(
      "click",
      ()=>{

        const index =
          songs.findIndex(
            s =>
              String(s.id) ===
              String(song.id)
          );

        if(index >= 0){

          playSong(index);

        }

      }
    );

    songList.appendChild(item);

  });

}


/* ================================
   PLAY SONG
================================ */

function playSong(index){

  if(
    index < 0 ||
    index >= songs.length
  ){
    return;
  }

  currentIndex =
    index;

  const song =
    songs[index];

  const fileId =
    song.file_id;

  if(!fileId){

    console.error(
      "Song has no file_id:",
      song
    );

    return;

  }

  audio.src =
    `${API}/audio?file_id=${
      encodeURIComponent(fileId)
    }`;

  miniTitle.textContent =
    song.title ||
    "Unknown Song";

  miniArtist.textContent =
    song.artist ||
    "Unknown Artist";

  fullTitle.textContent =
    song.title ||
    "Unknown Song";

  fullArtist.textContent =
    song.artist ||
    "Unknown Artist";

  seek.value = 0;
  miniProgress.value = 0;

  currentTime.textContent =
    "0:00";

  duration.textContent =
    "0:00";

  updateMediaSession(song);

  audio.load();

  audio.play()
    .then(()=>{

      if(
        audioContext &&
        audioContext.state ===
        "suspended"
      ){

        audioContext.resume();

      }

    })
    .catch(error=>{

      console.error(
        "Playback error:",
        error
      );

    });

  if(tg){

    try{

      tg.HapticFeedback
        .impactOccurred("light");

    }catch(e){}

  }

}


/* ================================
   PLAY / PAUSE
================================ */

function togglePlay(){

  if(!audio.src){

    if(songs.length){

      playSong(0);

    }

    return;

  }

  if(audio.paused){

    audio.play()
      .catch(error=>{
        console.error(
          "Play error:",
          error
        );
      });

  }else{

    audio.pause();

  }

}


miniPlay.addEventListener(
  "click",
  event=>{

    event.stopPropagation();

    togglePlay();

  }
);


mainPlay.addEventListener(
  "click",
  togglePlay
);


/* ================================
   ICON STATE
================================ */

function setPlayIcon(){

  const paused =
    audio.paused;

  const icon =
    paused
      ? `<path d="M8 5v14l11-7z"/>`
      : `
        <path d="M7 5h3v14H7z"/>
        <path d="M14 5h3v14h-3z"/>
      `;

  miniPlayIcon.innerHTML =
    icon;

  mainPlayIcon.innerHTML =
    icon;

}


audio.addEventListener(
  "play",
  ()=>{

    setPlayIcon();
    startVisualizer();

    if(
      "mediaSession" in navigator
    ){

      try{
        navigator.mediaSession.playbackState =
          "playing";
      }catch(e){}

    }

  }
);


audio.addEventListener(
  "pause",
  ()=>{

    setPlayIcon();

    if(
      "mediaSession" in navigator
    ){

      try{
        navigator.mediaSession.playbackState =
          "paused";
      }catch(e){}

    }

  }
);


/* ================================
   NEXT / PREVIOUS
================================ */

function nextSong(){

  if(!songs.length){
    return;
  }

  let index;

  if(shuffleMode){

    if(songs.length === 1){

      index = 0;

    }else{

      do{

        index =
          Math.floor(
            Math.random() *
            songs.length
          );

      }while(
        index === currentIndex
      );

    }

  }else{

    index =
      currentIndex + 1;

    if(index >= songs.length){

      index = 0;

    }

  }

  playSong(index);

}


function previousSong(){

  if(!songs.length){
    return;
  }

  if(audio.currentTime > 3){

    audio.currentTime = 0;

    return;

  }

  let index =
    currentIndex - 1;

  if(index < 0){

    index =
      songs.length - 1;

  }

  playSong(index);

}


next.addEventListener(
  "click",
  nextSong
);

previous.addEventListener(
  "click",
  previousSong
);


/* ================================
   END
================================ */

audio.addEventListener(
  "ended",
  ()=>{

    if(repeatMode){

      audio.currentTime = 0;

      audio.play()
        .catch(error=>{
          console.error(
            "Repeat playback error:",
            error
          );
        });

    }else{

      nextSong();

    }

  }
);


/* ================================
   SEEK
================================ */

audio.addEventListener(
  "loadedmetadata",
  ()=>{

    duration.textContent =
      formatTime(
        audio.duration
      );

  }
);


audio.addEventListener(
  "timeupdate",
  ()=>{

    if(!audio.duration){
      return;
    }

    const value =
      (
        audio.currentTime /
        audio.duration
      ) * 100;

    seek.value =
      value;

    miniProgress.value =
      value;

    currentTime.textContent =
      formatTime(
        audio.currentTime
      );

  }
);


function seekTo(value){

  if(!audio.duration){
    return;
  }

  audio.currentTime =
    (
      Number(value) /
      100
    ) *
    audio.duration;

}


seek.addEventListener(
  "input",
  ()=>{
    seekTo(seek.value);
  }
);


miniProgress.addEventListener(
  "input",
  ()=>{
    seekTo(
      miniProgress.value
    );
  }
);


/* ================================
   SHUFFLE
================================ */

shuffle.addEventListener(
  "click",
  ()=>{

    shuffleMode =
      !shuffleMode;

    shuffle.classList.toggle(
      "active",
      shuffleMode
    );

  }
);


/* ================================
   REPEAT
================================ */

repeat.addEventListener(
  "click",
  ()=>{

    repeatMode =
      !repeatMode;

    repeat.classList.toggle(
      "active",
      repeatMode
    );

  }
);


/* ================================
   MUTE
================================ */

mute.addEventListener(
  "click",
  ()=>{

    isMuted =
      !isMuted;

    audio.muted =
      isMuted;

    mute.classList.toggle(
      "active",
      isMuted
    );

    if(isMuted){

      muteIcon.innerHTML = `

        <path
          d="M4 10v4h4l5 4V6l-5 4H4z"
          stroke-linejoin="round"
        />

        <path
          d="M16 9l4 6M20 9l-4 6"
          stroke-linecap="round"
        />

      `;

    }else{

      muteIcon.innerHTML = `

        <path
          d="M4 10v4h4l5 4V6l-5 4H4z"
          stroke-linejoin="round"
        />

        <path
          d="M16 9c1.5 1.5 1.5 4.5 0 6"
          stroke-linecap="round"
        />

      `;

    }

  }
);


/* ================================
   FULL PLAYER
================================ */

mini.addEventListener(
  "click",
  event=>{

    if(
      event.target.closest(
        "#miniPlay"
      ) ||
      event.target.closest(
        "#miniProgress"
      )
    ){

      return;

    }

    full.classList.add("open");

  }
);


closeFull.addEventListener(
  "click",
  ()=>{
    full.classList.remove("open");
  }
);


/* ================================
   SWIPE DOWN
================================ */

let touchStart = 0;

full.addEventListener(
  "touchstart",
  event=>{

    touchStart =
      event.touches[0].clientY;

  },
  {
    passive:true
  }
);


full.addEventListener(
  "touchend",
  event=>{

    const end =
      event.changedTouches[0].clientY;

    if(
      end - touchStart > 100
    ){

      full.classList.remove(
        "open"
      );

    }

  },
  {
    passive:true
  }
);


/* ================================
   QUEUE
================================ */

function renderQueue(){

  queueList.innerHTML = "";

  songs.forEach(
    (song,index)=>{

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "queue-item";

      item.innerHTML = `

        <div
          class="cover"
          style="
            width:40px;
            height:40px;
            flex:0 0 40px;
          "
        >
          ♪
        </div>

        <div class="queue-item-info">

          <div class="queue-item-title">
            ${escapeHTML(song.title)}
          </div>

          <div class="queue-item-artist">
            ${escapeHTML(song.artist)}
          </div>

        </div>

      `;

      item.addEventListener(
        "click",
        ()=>{

          playSong(index);

          queue.classList.remove(
            "open"
          );

        }
      );

      queueList.appendChild(item);

    }
  );

}


function showQueue(){

  queue.classList.add(
    "open"
  );

}


function hideQueue(){

  queue.classList.remove(
    "open"
  );

}


openQueueButton.addEventListener(
  "click",
  showQueue
);

queue2.addEventListener(
  "click",
  showQueue
);


/* ================================
   CLOSE QUEUE ON OUTSIDE TOUCH
================================ */

queue.addEventListener(
  "click",
  event=>{

    if(
      event.target === queue
    ){

      hideQueue();

    }

  }
);


/* ================================
   SEARCH
================================ */

search.addEventListener(
  "input",
  ()=>{

    const query =
      search.value
        .trim()
        .toLowerCase();

    const result =
      songs.filter(
        song=>{

          const title =
            String(
              song.title || ""
            ).toLowerCase();

          const artist =
            String(
              song.artist || ""
            ).toLowerCase();

          return (
            title.includes(query) ||
            artist.includes(query)
          );

        }
      );

    renderSongs(result);

  }
);


/* ================================
   VISUALIZER
================================ */

function setupVisualizer(){

  if(analyser){
    return;
  }

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext){
      return;
    }

    audioContext =
      new AudioContext();

    analyser =
      audioContext.createAnalyser();

    analyser.fftSize =
      256;

    analyser.smoothingTimeConstant =
      .82;

    sourceNode =
      audioContext
        .createMediaElementSource(
          audio
        );

    sourceNode.connect(
      analyser
    );

    analyser.connect(
      audioContext.destination
    );

  }catch(error){

    console.error(
      "Visualizer setup:",
      error
    );

  }

}


function startVisualizer(){

  setupVisualizer();

  if(
    audioContext &&
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume()
      .catch(()=>{});

  }

  if(visualizerRunning){
    return;
  }

  visualizerRunning =
    true;

  drawVisualizer();

}


function drawVisualizer(){

  requestAnimationFrame(
    drawVisualizer
  );

  const rect =
    canvas.getBoundingClientRect();

  const width =
    rect.width;

  const height =
    rect.height;

  if(
    width <= 0 ||
    height <= 0
  ){

    return;

  }

  const dpr =
    window.devicePixelRatio || 1;

  const targetWidth =
    Math.round(width * dpr);

  const targetHeight =
    Math.round(height * dpr);

  if(
    canvas.width !== targetWidth ||
    canvas.height !== targetHeight
  ){

    canvas.width =
      targetWidth;

    canvas.height =
      targetHeight;

  }

  const ctx =
    canvas.getContext("2d");

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  if(!analyser){
    return;
  }

  const data =
    new Uint8Array(
      analyser.frequencyBinCount
    );

  analyser.getByteFrequencyData(
    data
  );

  const bars =
    Math.min(
      72,
      data.length
    );

  const cx =
    width / 2;

  const cy =
    height / 2;

  const radius =
    Math.min(
      width,
      height
    ) * .19;

  for(
    let i = 0;
    i < bars;
    i++
  ){

    const value =
      data[i] / 255;

    const angle =
      (
        i / bars
      ) *
      Math.PI *
      2;

    const inner =
      radius + 8;

    const outer =
      inner +
      value * 90;

    const x1 =
      cx +
      Math.cos(angle) *
      inner;

    const y1 =
      cy +
      Math.sin(angle) *
      inner;

    const x2 =
      cx +
      Math.cos(angle) *
      outer;

    const y2 =
      cy +
      Math.sin(angle) *
      outer;

    ctx.beginPath();

    ctx.moveTo(
      x1,
      y1
    );

    ctx.lineTo(
      x2,
      y2
    );

    ctx.lineWidth = 2;
    ctx.lineCap = "round";

    ctx.strokeStyle =
      `rgba(
        255,
        255,
        255,
        ${.12 + value * .8}
      )`;

    ctx.stroke();

  }

}


/* ================================
   MEDIA SESSION
================================ */

function updateMediaSession(song){

  if(
    !("mediaSession" in navigator)
  ){

    return;

  }

  try{

    navigator.mediaSession.metadata =
      new MediaMetadata({

        title:
          song.title ||
          "Unknown Song",

        artist:
          song.artist ||
          "Unknown Artist",

        album:
          "SoundMe"

      });

  }catch(error){

    console.error(
      "Media Session:",
      error
    );

  }

}


if(
  "mediaSession" in navigator
){

  try{

    navigator.mediaSession
      .setActionHandler(
        "play",
        ()=>{
          audio.play()
            .catch(()=>{});
        }
      );

    navigator.mediaSession
      .setActionHandler(
        "pause",
        ()=>{
          audio.pause();
        }
      );

    navigator.mediaSession
      .setActionHandler(
        "nexttrack",
        nextSong
      );

    navigator.mediaSession
      .setActionHandler(
        "previoustrack",
        previousSong
      );

    try{

      navigator.mediaSession
        .setActionHandler(
          "seekbackward",
          details=>{

            audio.currentTime =
              Math.max(
                0,
                audio.currentTime -
                (details.seekOffset || 10)
              );

          }
        );

      navigator.mediaSession
        .setActionHandler(
          "seekforward",
          details=>{

            audio.currentTime =
              Math.min(
                audio.duration || Infinity,
                audio.currentTime +
                (details.seekOffset || 10)
              );

          }
        );

    }catch(e){}

  }catch(e){}

}


/* ================================
   PAGE VISIBILITY
================================ */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      !document.hidden &&
      audioContext &&
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume()
        .catch(()=>{});

    }

  }
);


/* ================================
   INIT
================================ */

setPlayIcon();

loadSongs();

</script>
