<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>SoundMe</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #080808;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
    overflow-x: hidden;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
    color: inherit;
    background: none;
    cursor: pointer;
}

.app {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
}

/* ================================
   HEADER
================================ */

.header {
    padding: 24px 18px 14px;
}

.brand {
    font-size: 27px;
    font-weight: 750;
    letter-spacing: -1px;
}

.user {
    margin-top: 4px;
    color: #777;
    font-size: 13px;
}

/* ================================
   SEARCH
================================ */

.search-wrap {
    padding: 5px 18px 20px;
}

.search {
    width: 100%;
    height: 45px;
    padding: 0 15px;

    border-radius: 12px;
    border: 1px solid #222;

    background: #131313;
    color: #fff;

    outline: none;
    font-size: 15px;
}

.search::placeholder {
    color: #666;
}

.search:focus {
    border-color: #3a3a3a;
}

/* ================================
   LIBRARY
================================ */

.section {
    padding: 0 18px;
}

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}

.section-title h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 650;
}

.count {
    color: #666;
    font-size: 12px;
}

.song-list {
    width: 100%;
}

.song {
    display: flex;
    align-items: center;
    width: 100%;
    gap: 12px;
    padding: 10px 0;
}

.song:active {
    opacity: .55;
}

.cover {
    width: 50px;
    height: 50px;
    flex: 0 0 50px;

    border-radius: 9px;
    background:
        linear-gradient(
            135deg,
            #292929,
            #141414
        );

    display: flex;
    align-items: center;
    justify-content: center;

    color: #aaa;
    font-size: 18px;
}

.song-info {
    flex: 1;
    min-width: 0;
}

.song-title {
    font-size: 15px;
    font-weight: 500;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.song-artist {
    margin-top: 4px;
    color: #707070;
    font-size: 12px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.song-duration {
    color: #666;
    font-size: 11px;
}

/* ================================
   EMPTY / LOADING
================================ */

.empty,
.loading {
    padding: 60px 20px;
    text-align: center;
    color: #666;
    font-size: 13px;
}

.empty {
    display: none;
}

.empty-title {
    color: #aaa;
    font-size: 15px;
    margin-bottom: 6px;
}

/* ================================
   MINI PLAYER
================================ */

.mini-player {
    position: fixed;
    z-index: 30;

    left: 10px;
    right: 10px;
    bottom: calc(8px + env(safe-area-inset-bottom));

    max-width: 700px;
    margin: 0 auto;

    padding: 9px 10px;

    border-radius: 15px;

    background: rgba(22,22,22,.96);
    border: 1px solid #292929;

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    box-shadow:
        0 12px 40px rgba(0,0,0,.45);

    transition:
        transform .25s ease,
        opacity .25s ease;
}

.mini-top {
    display: flex;
    align-items: center;
    gap: 10px;
}

.mini-cover {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;

    border-radius: 8px;

    background: #202020;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #888;
}

.mini-info {
    flex: 1;
    min-width: 0;
}

.mini-title {
    font-size: 13px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.mini-artist {
    margin-top: 2px;
    color: #6d6d6d;
    font-size: 11px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.mini-play {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    background: #fff;
    color: #000;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 15px;
}

.mini-progress {
    width: 100%;
    height: 2px;

    margin-top: 7px;

    appearance: none;
    -webkit-appearance: none;

    background: #333;
}

.mini-progress::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 7px;
    height: 7px;

    border-radius: 50%;
    background: #fff;
}

/* ================================
   FULL PLAYER
================================ */

.full-player {
    position: fixed;
    z-index: 100;

    inset: 0;

    display: flex;
    flex-direction: column;

    background: #080808;

    padding:
        calc(14px + env(safe-area-inset-top))
        18px
        calc(18px + env(safe-area-inset-bottom));

    transform: translateY(100%);
    opacity: 0;
    pointer-events: none;

    transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        opacity .25s ease;
}

.full-player.open {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
}

.full-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.full-header button {
    width: 42px;
    height: 42px;

    border-radius: 50%;

    background: #151515;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 19px;
}

.full-title-small {
    font-size: 11px;
    color: #666;
    letter-spacing: 1px;
    text-transform: uppercase;
}

/* ================================
   VISUALIZER
================================ */

.visualizer-wrap {
    position: relative;

    width: 100%;
    height: min(52vh, 430px);

    margin-top: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.visualizer {
    width: 100%;
    height: 100%;
}

.visualizer-glow {
    position: absolute;

    width: 170px;
    height: 170px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.09),
            transparent 70%
        );

    filter: blur(20px);

    pointer-events: none;
}

/* ================================
   FULL INFO
================================ */

.full-info {
    margin-top: 10px;
}

.full-song-title {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -.7px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.full-song-artist {
    margin-top: 5px;
    color: #777;
    font-size: 14px;
}

/* ================================
   SEEK
================================ */

.seek-area {
    margin-top: 28px;
}

.seek {
    width: 100%;
    height: 4px;

    appearance: none;
    -webkit-appearance: none;

    background: #303030;
    border-radius: 10px;
    outline: none;
}

.seek::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: #fff;
}

.seek::-moz-range-thumb {
    width: 12px;
    height: 12px;

    border: 0;
    border-radius: 50%;

    background: #fff;
}

.time-row {
    display: flex;
    justify-content: space-between;

    margin-top: 7px;

    color: #666;
    font-size: 10px;
}

/* ================================
   CONTROLS
================================ */

.controls {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 25px;

    margin-top: 27px;
}

.control {
    width: 40px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #aaa;

    font-size: 19px;
}

.control.active {
    color: #fff;
}

.main-play {
    width: 64px;
    height: 64px;

    border-radius: 50%;

    background: #fff;
    color: #000;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 23px;
}

/* ================================
   SECONDARY CONTROLS
================================ */

.secondary {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-top: 25px;
}

.secondary button {
    width: 38px;
    height: 38px;

    color: #666;

    display: flex;
    align-items: center;
    justify-content: center;
}

.secondary button.active {
    color: #fff;
}

/* ================================
   QUEUE
================================ */

.queue {
    position: fixed;
    z-index: 110;

    left: 0;
    right: 0;
    bottom: 0;

    max-height: 65vh;

    background: #151515;

    border-radius: 20px 20px 0 0;
    border-top: 1px solid #292929;

    padding:
        14px
        18px
        calc(18px + env(safe-area-inset-bottom));

    transform: translateY(100%);

    transition:
        transform .3s ease;
}

.queue.open {
    transform: translateY(0);
}

.queue-handle {
    width: 38px;
    height: 4px;

    margin: 0 auto 15px;

    border-radius: 10px;

    background: #444;
}

.queue-title {
    font-size: 17px;
    font-weight: 650;
    margin-bottom: 10px;
}

.queue-list {
    max-height: 48vh;
    overflow-y: auto;
}

.queue-item {
    display: flex;
    align-items: center;

    gap: 10px;

    padding: 10px 0;
}

.queue-item-info {
    flex: 1;
    min-width: 0;
}

.queue-item-title {
    font-size: 13px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.queue-item-artist {
    color: #666;
    font-size: 11px;
    margin-top: 3px;
}

/* ================================
   VOLUME
================================ */

.volume {
    width: 90px;
    height: 3px;

    appearance: none;
    -webkit-appearance: none;

    background: #333;
}

.volume::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 9px;
    height: 9px;

    border-radius: 50%;
    background: #fff;
}

/* ================================
   MOBILE
================================ */

@media (max-width: 500px) {

    .visualizer-wrap {
        height: 43vh;
    }

    .full-song-title {
        font-size: 22px;
    }

    .controls {
        gap: 17px;
    }

}

</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">
            SoundMe
        </div>

        <div
            class="user"
            id="userName"
        >
            Music Library
        </div>

    </header>


    <div class="search-wrap">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search songs..."
            autocomplete="off"
        >

    </div>


    <main class="section">

        <div class="section-title">

            <h2>
                All Songs
            </h2>

            <span
                class="count"
                id="songCount"
            >
                0 songs
            </span>

        </div>


        <div
            id="loading"
            class="loading"
        >
            Loading library...
        </div>


        <div
            id="songList"
            class="song-list"
        ></div>


        <div
            id="empty"
            class="empty"
        >

            <div class="empty-title">
                No songs
            </div>

            <div>
                Forward music to @SoundM3Bot
                to add it to your library.
            </div>

        </div>

    </main>

</div>


<!-- ================================
     MINI PLAYER
================================ -->

<div
    class="mini-player"
    id="miniPlayer"
>

    <div class="mini-top">

        <div
            class="mini-cover"
            id="miniCover"
        >
            ♪
        </div>


        <div class="mini-info">

            <div
                class="mini-title"
                id="miniTitle"
            >
                Nothing playing
            </div>

            <div
                class="mini-artist"
                id="miniArtist"
            >
                Select a song
            </div>

        </div>


        <button
            class="mini-play"
            id="miniPlay"
        >
            ▶
        </button>

    </div>


    <input
        id="miniProgress"
        class="mini-progress"
        type="range"
        min="0"
        max="100"
        value="0"
    >

</div>


<!-- ================================
     FULL PLAYER
================================ -->

<div
    class="full-player"
    id="fullPlayer"
>

    <div class="full-header">

        <button
            id="closeFull"
            aria-label="Close"
        >
            ↓
        </button>

        <div class="full-title-small">
            NOW PLAYING
        </div>

        <button
            id="queueButton"
            aria-label="Queue"
        >
            ☷
        </button>

    </div>


    <div
        class="visualizer-wrap"
        id="visualizerWrap"
    >

        <div class="visualizer-glow"></div>

        <canvas
            id="visualizer"
            class="visualizer"
        ></canvas>

    </div>


    <div class="full-info">

        <div
            class="full-song-title"
            id="fullTitle"
        >
            Nothing playing
        </div>

        <div
            class="full-song-artist"
            id="fullArtist"
        >
            Select a song
        </div>

    </div>


    <div class="seek-area">

        <input
            id="seek"
            class="seek"
            type="range"
            min="0"
            max="100"
            value="0"
        >

        <div class="time-row">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <div class="controls">

        <button
            id="shuffle"
            class="control"
            title="Shuffle"
        >
            ⤨
        </button>

        <button
            id="previous"
            class="control"
            title="Previous"
        >
            ◀◀
        </button>

        <button
            id="mainPlay"
            class="main-play"
            title="Play"
        >
            ▶
        </button>

        <button
            id="next"
            class="control"
            title="Next"
        >
            ▶▶
        </button>

        <button
            id="repeat"
            class="control"
            title="Repeat"
        >
            ↻
        </button>

    </div>


    <div class="secondary">

        <button
            id="mute"
            title="Mute"
        >
            🔊
        </button>


        <input
            id="volume"
            class="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >


        <button
            id="queueButton2"
            title="Queue"
        >
            ☷
        </button>

    </div>

</div>


<!-- ================================
     QUEUE
================================ -->

<div
    class="queue"
    id="queue"
>

    <div class="queue-handle"></div>

    <div class="queue-title">
        Up Next
    </div>

    <div
        class="queue-list"
        id="queueList"
    ></div>

</div>


<audio
    id="audio"
    preload="metadata"
></audio>


<script>

/* =========================================
   CONFIG
========================================= */

const API =
    "https://soundme-api.mahantem2.workers.dev";


/* =========================================
   TELEGRAM
========================================= */

const tg =
    window.Telegram?.WebApp;

let telegramUser = null;

if (tg) {

    tg.ready();
    tg.expand();

    try {

        tg.setHeaderColor("#080808");
        tg.setBackgroundColor("#080808");

    } catch (error) {}

    telegramUser =
        tg.initDataUnsafe?.user ||
        null;

}


/* =========================================
   ELEMENTS
========================================= */

const userName =
    document.getElementById("userName");

const search =
    document.getElementById("search");

const songList =
    document.getElementById("songList");

const songCount =
    document.getElementById("songCount");

const loading =
    document.getElementById("loading");

const empty =
    document.getElementById("empty");

const audio =
    document.getElementById("audio");

const miniPlayer =
    document.getElementById("miniPlayer");

const miniTitle =
    document.getElementById("miniTitle");

const miniArtist =
    document.getElementById("miniArtist");

const miniPlay =
    document.getElementById("miniPlay");

const miniProgress =
    document.getElementById("miniProgress");

const fullPlayer =
    document.getElementById("fullPlayer");

const closeFull =
    document.getElementById("closeFull");

const fullTitle =
    document.getElementById("fullTitle");

const fullArtist =
    document.getElementById("fullArtist");

const mainPlay =
    document.getElementById("mainPlay");

const previous =
    document.getElementById("previous");

const next =
    document.getElementById("next");

const shuffle =
    document.getElementById("shuffle");

const repeat =
    document.getElementById("repeat");

const seek =
    document.getElementById("seek");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const mute =
    document.getElementById("mute");

const volume =
    document.getElementById("volume");

const queue =
    document.getElementById("queue");

const queueButton =
    document.getElementById("queueButton");

const queueButton2 =
    document.getElementById("queueButton2");

const queueList =
    document.getElementById("queueList");

const canvas =
    document.getElementById("visualizer");

const visualizerWrap =
    document.getElementById("visualizerWrap");


/* =========================================
   USER
========================================= */

if (telegramUser) {

    const first =
        telegramUser.first_name || "";

    const last =
        telegramUser.last_name || "";

    const name =
        `${first} ${last}`.trim();

    if (name) {

        userName.textContent =
            `Hi, ${name}`;

    }

}


/* =========================================
   STATE
========================================= */

let songs = [];

let filteredSongs = [];

let currentIndex = -1;

let shuffleMode = false;

let repeatMode = "all";

let audioContext = null;

let analyser = null;

let sourceNode = null;

let visualizerStarted = false;


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(value) {

    if (!Number.isFinite(Number(value))) {
        return "0:00";
    }

    const total =
        Math.floor(Number(value));

    const minutes =
        Math.floor(total / 60);

    const seconds =
        String(total % 60)
            .padStart(2, "0");

    return `${minutes}:${seconds}`;

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================
   LOAD SONGS
========================================= */

async function loadSongs() {

    if (!telegramUser?.id) {

        loading.textContent =
            "Open SoundMe from Telegram.";

        return;

    }

    loading.style.display =
        "block";

    try {

        const response =
            await fetch(
                `${API}/songs?user_id=${encodeURIComponent(
                    telegramUser.id
                )}`
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.error ||
                "Unable to load library"
            );
        }

        songs =
            Array.isArray(data.songs)
                ? data.songs
                : [];

        filteredSongs =
            [...songs];

        loading.style.display =
            "none";

        renderSongs(filteredSongs);

        renderQueue();

    } catch (error) {

        console.error(error);

        loading.textContent =
            "Couldn't load your library.";

    }

}


/* =========================================
   RENDER LIBRARY
========================================= */

function renderSongs(list) {

    songList.innerHTML = "";

    songCount.textContent =
        `${list.length} ${
            list.length === 1
                ? "song"
                : "songs"
        }`;

    if (!list.length) {

        empty.style.display =
            "block";

        return;

    }

    empty.style.display =
        "none";

    list.forEach(song => {

        const item =
            document.createElement("div");

        item.className =
            "song";

        item.innerHTML = `

            <div class="cover">
                ♪
            </div>

            <div class="song-info">

                <div class="song-title">
                    ${escapeHTML(song.title)}
                </div>

                <div class="song-artist">
                    ${escapeHTML(song.artist)}
                </div>

            </div>

            <div class="song-duration">
                ${formatTime(song.duration)}
            </div>

        `;

        item.addEventListener(
            "click",
            () => {

                const index =
                    songs.findIndex(
                        s =>
                            s.id === song.id
                    );

                if (index !== -1) {
                    playIndex(index);
                }

            }
        );

        songList.appendChild(item);

    });

}


/* =========================================
   PLAY SONG
========================================= */

function playIndex(index) {

    if (
        index < 0 ||
        index >= songs.length
    ) {
        return;
    }

    currentIndex =
        index;

    const song =
        songs[currentIndex];

    if (!song.file_id) {
        return;
    }

    const streamUrl =
        `${API}/audio?user_id=${encodeURIComponent(
            telegramUser.id
        )}&file_id=${encodeURIComponent(
            song.file_id
        )}`;

    audio.src =
        streamUrl;

    audio.dataset.fileId =
        song.file_id;

    updatePlayer(song);

    audio.play()
        .catch(error => {
            console.error(
                "Playback failed:",
                error
            );
        });

    if (tg) {

        try {

            tg.HapticFeedback
                .impactOccurred("light");

        } catch (error) {}

    }

}


/* =========================================
   UPDATE PLAYER
========================================= */

function updatePlayer(song) {

    const title =
        song.title ||
        "Unknown Song";

    const artist =
        song.artist ||
        "Unknown Artist";

    miniTitle.textContent =
        title;

    miniArtist.textContent =
        artist;

    fullTitle.textContent =
        title;

    fullArtist.textContent =
        artist;

    updateMediaSession(song);

}


/* =========================================
   PLAY / PAUSE
========================================= */

function togglePlay() {

    if (!audio.src) {

        if (songs.length) {
            playIndex(0);
        }

        return;

    }

    if (audio.paused) {

        audio.play();

    } else {

        audio.pause();

    }

}


/* =========================================
   NEXT
========================================= */

function nextSong() {

    if (!songs.length) {
        return;
    }

    let index;

    if (shuffleMode) {

        index =
            Math.floor(
                Math.random() *
                songs.length
            );

    } else {

        index =
            currentIndex + 1;

        if (index >= songs.length) {

            if (repeatMode === "all") {
                index = 0;
            } else {
                return;
            }

        }

    }

    playIndex(index);

}


/* =========================================
   PREVIOUS
========================================= */

function previousSong() {

    if (!songs.length) {
        return;
    }

    if (audio.currentTime > 3) {

        audio.currentTime = 0;

        return;

    }

    let index =
        currentIndex - 1;

    if (index < 0) {
        index =
            songs.length - 1;
    }

    playIndex(index);

}


/* =========================================
   REPEAT
========================================= */

function cycleRepeat() {

    if (repeatMode === "all") {

        repeatMode = "one";

        repeat.textContent = "↻¹";
        repeat.classList.add("active");

    } else {

        repeatMode = "all";

        repeat.textContent = "↻";
        repeat.classList.remove("active");

    }

}


/* =========================================
   SHUFFLE
========================================= */

function toggleShuffle() {

    shuffleMode =
        !shuffleMode;

    shuffle.classList.toggle(
        "active",
        shuffleMode
    );

}


/* =========================================
   AUDIO EVENTS
========================================= */

audio.addEventListener(
    "play",
    () => {

        miniPlay.textContent =
            "❚❚";

        mainPlay.textContent =
            "❚❚";

        startVisualizer();

    }
);


audio.addEventListener(
    "pause",
    () => {

        miniPlay.textContent =
            "▶";

        mainPlay.textContent =
            "▶";

    }
);


audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


audio.addEventListener(
    "timeupdate",
    () => {

        if (!audio.duration) {
            return;
        }

        const percentage =
            (
                audio.currentTime /
                audio.duration
            ) * 100;

        seek.value =
            percentage;

        miniProgress.value =
            percentage;

        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


audio.addEventListener(
    "ended",
    () => {

        if (
            repeatMode ===
            "one"
        ) {

            audio.currentTime =
                0;

            audio.play();

            return;

        }

        nextSong();

    }
);


/* =========================================
   SEEK
========================================= */

function seekAudio(value) {

    if (!audio.duration) {
        return;
    }

    audio.currentTime =
        (
            Number(value) / 100
        ) *
        audio.duration;

}

seek.addEventListener(
    "input",
    () => {

        seekAudio(
            seek.value
        );

    }
);

miniProgress.addEventListener(
    "input",
    () => {

        seekAudio(
            miniProgress.value
        );

    }
);


/* =========================================
   VOLUME
========================================= */

volume.addEventListener(
    "input",
    () => {

        audio.volume =
            Number(volume.value);

        audio.muted =
            audio.volume === 0;

        updateMuteIcon();

    }
);


mute.addEventListener(
    "click",
    () => {

        audio.muted =
            !audio.muted;

        updateMuteIcon();

    }
);


function updateMuteIcon() {

    if (
        audio.muted ||
        audio.volume === 0
    ) {

        mute.textContent =
            "🔇";

    } else {

        mute.textContent =
            "🔊";

    }

}


/* =========================================
   FULL PLAYER
========================================= */

function openFullPlayer() {

    fullPlayer.classList.add(
        "open"
    );

}


function closeFullPlayer() {

    fullPlayer.classList.remove(
        "open"
    );

}


miniPlayer.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            miniPlay
        ) {
            return;
        }

        openFullPlayer();

    }
);


miniPlay.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        togglePlay();

    }
);


closeFull.addEventListener(
    "click",
    closeFullPlayer
);


/* =========================================
   SWIPE DOWN TO CLOSE
========================================= */

let touchStartY = 0;

fullPlayer.addEventListener(
    "touchstart",
    event => {

        touchStartY =
            event.touches[0].clientY;

    },
    {
        passive: true
    }
);


fullPlayer.addEventListener(
    "touchend",
    event => {

        const endY =
            event.changedTouches[0].clientY;

        const distance =
            endY - touchStartY;

        if (distance > 100) {
            closeFullPlayer();
        }

    },
    {
        passive: true
    }
);


/* =========================================
   QUEUE
========================================= */

function openQueue() {

    queue.classList.add(
        "open"
    );

    renderQueue();

}


function closeQueue() {

    queue.classList.remove(
        "open"
    );

}


queueButton.addEventListener(
    "click",
    openQueue
);

queueButton2.addEventListener(
    "click",
    openQueue
);


queue.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            queue
        ) {
            closeQueue();
        }

    }
);


function renderQueue() {

    queueList.innerHTML = "";

    songs.forEach(
        (song, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "queue-item";

            item.innerHTML = `

                <div class="cover"
                     style="
                     width:40px;
                     height:40px;
                     flex:0 0 40px;
                     ">
                    ♪
                </div>

                <div class="queue-item-info">

                    <div class="queue-item-title">
                        ${escapeHTML(song.title)}
                    </div>

                    <div class="queue-item-artist">
                        ${escapeHTML(song.artist)}
                    </div>

                </div>

            `;

            item.addEventListener(
                "click",
                () => {

                    playIndex(index);
                    closeQueue();

                }
            );

            queueList.appendChild(
                item
            );

        }
    );

}


/* =========================================
   MAIN CONTROLS
========================================= */

mainPlay.addEventListener(
    "click",
    togglePlay
);

previous.addEventListener(
    "click",
    previousSong
);

next.addEventListener(
    "click",
    nextSong
);

shuffle.addEventListener(
    "click",
    toggleShuffle
);

repeat.addEventListener(
    "click",
    cycleRepeat
);


/* =========================================
   SEARCH
========================================= */

search.addEventListener(
    "input",
    () => {

        const query =
            search.value
                .trim()
                .toLowerCase();

        filteredSongs =
            songs.filter(
                song => {

                    const title =
                        String(
                            song.title || ""
                        ).toLowerCase();

                    const artist =
                        String(
                            song.artist || ""
                        ).toLowerCase();

                    return (
                        title.includes(query) ||
                        artist.includes(query)
                    );

                }
            );

        renderSongs(
            filteredSongs
        );

    }
);


/* =========================================
   MEDIA SESSION
========================================= */

function updateMediaSession(song) {

    if (
        !("mediaSession" in navigator)
    ) {
        return;
    }

    try {

        navigator.mediaSession.metadata =
            new MediaMetadata({

                title:
                    song.title ||
                    "Unknown Song",

                artist:
                    song.artist ||
                    "Unknown Artist",

                album:
                    "SoundMe"

            });

    } catch (error) {}

}


if (
    "mediaSession" in navigator
) {

    try {

        navigator.mediaSession.setActionHandler(
            "play",
            () => audio.play()
        );

        navigator.mediaSession.setActionHandler(
            "pause",
            () => audio.pause()
        );

        navigator.mediaSession.setActionHandler(
            "previoustrack",
            previousSong
        );

        navigator.mediaSession.setActionHandler(
            "nexttrack",
            nextSong
        );

        navigator.mediaSession.setActionHandler(
            "seekbackward",
            () => {

                audio.currentTime =
                    Math.max(
                        0,
                        audio.currentTime - 10
                    );

            }
        );

        navigator.mediaSession.setActionHandler(
            "seekforward",
            () => {

                audio.currentTime =
                    Math.min(
                        audio.duration || 0,
                        audio.currentTime + 10
                    );

            }
        );

    } catch (error) {}

}


/* =========================================
   AUDIO VISUALIZER
========================================= */

function setupAudioContext() {

    if (audioContext) {
        return;
    }

    try {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        analyser =
            audioContext.createAnalyser();

        analyser.fftSize =
            256;

        analyser.smoothingTimeConstant =
            0.82;

        sourceNode =
            audioContext.createMediaElementSource(
                audio
            );

        sourceNode.connect(
            analyser
        );

        analyser.connect(
            audioContext.destination
        );

    } catch (error) {

        console.error(
            "Visualizer setup failed:",
            error
        );

    }

}


function startVisualizer() {

    setupAudioContext();

    if (
        audioContext &&
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

    if (visualizerStarted) {
        return;
    }

    visualizerStarted =
        true;

    drawVisualizer();

}


function drawVisualizer() {

    requestAnimationFrame(
        drawVisualizer
    );

    const rect =
        visualizerWrap.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    const width =
        rect.width;

    const height =
        rect.height;

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    const ctx =
        canvas.getContext(
            "2d"
        );

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    if (!analyser) {
        return;
    }

    const bufferLength =
        analyser.frequencyBinCount;

    const data =
        new Uint8Array(
            bufferLength
        );

    analyser.getByteFrequencyData(
        data
    );


    const bars =
        Math.min(
            64,
            bufferLength
        );

    const centerX =
        width / 2;

    const centerY =
        height / 2;

    const radius =
        Math.min(
            width,
            height
        ) * .19;

    for (
        let i = 0;
        i < bars;
        i++
    ) {

        const value =
            data[i] / 255;

        const angle =
            (
                i / bars
            ) *
            Math.PI *
            2;

        const inner =
            radius +
            7;

        const outer =
            inner +
            value * 95;

        const x1 =
            centerX +
            Math.cos(angle) *
            inner;

        const y1 =
            centerY +
            Math.sin(angle) *
            inner;

        const x2 =
            centerX +
            Math.cos(angle) *
            outer;

        const y2 =
            centerY +
            Math.sin(angle) *
            outer;

        ctx.beginPath();

        ctx.moveTo(
            x1,
            y1
        );

        ctx.lineTo(
            x2,
            y2
        );

        ctx.lineWidth =
            2.2;

        ctx.lineCap =
            "round";

        ctx.strokeStyle =
            `rgba(
                255,
                255,
                255,
                ${.15 + value * .8}
            )`;

        ctx.stroke();

    }


    /*
        Center pulse
    */

    let bass = 0;

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        bass +=
            data[i] || 0;

    }

    bass /=
        10;

    const pulse =
        radius +
        (bass / 255) * 18;


    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        pulse,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(255,255,255,.025)";

    ctx.fill();

}


/* =========================================
   RESUME AUDIO CONTEXT
========================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            !document.hidden &&
            audioContext &&
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }

    }
);


/* =========================================
   INITIALIZE
========================================= */

audio.volume = 1;

loadSongs();

</script>
